name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  safety-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 离线断言评测: 零 API 成本，每次 push 必跑
      # 注入主题被安全闸拦在 LLM 之前，所以占位 key 就够（不需要 secrets）
      # 未来接入付费评测（eval_runner --full）时再换成真 secrets + 手动触发
      - name: 安全评测（12 项断言，零 API 成本）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'ci-dummy' }}
        run: python eval_safety.py
